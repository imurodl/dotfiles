# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Reduce escape delay (important for vim/neovim users)
set -sg escape-time 0

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Easier split shortcuts (| for vertical, - for horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Switch windows with Shift+arrow
bind -n S-Left previous-window
bind -n S-Right next-window

# Reload config with prefix+r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Don't auto-rename windows
set -g allow-rename off

# Vi mode for copy mode
setw -g mode-keys vi

# Focus events (for neovim autoread, etc.)
set -g focus-events on

# ===== Status Bar (Arch Blue Theme) =====
set -g status-position bottom
set -g status-style 'bg=#1a1a2e fg=#a0a0b0'
set -g status-left '#[fg=#1a1a2e,bg=#1793d1,bold] #S #[fg=#1793d1,bg=#1a1a2e]'
set -g status-left-length 30
set -g status-right '#[fg=#1793d1]#[fg=#1a1a2e,bg=#1793d1] %H:%M #[fg=#a0a0b0,bg=#1793d1]#[fg=#1a1a2e,bg=#a0a0b0,bold] %d-%b '
set -g status-right-length 50

# Window status
setw -g window-status-format '#[fg=#a0a0b0,bg=#1a1a2e] #I:#W '
setw -g window-status-current-format '#[fg=#1a1a2e,bg=#1793d1]#[fg=#1a1a2e,bg=#1793d1,bold] #I:#W #[fg=#1793d1,bg=#1a1a2e]'

# Pane borders
set -g pane-border-style 'fg=#3a3a5e'
set -g pane-active-border-style 'fg=#1793d1'

# Message style
set -g message-style 'bg=#1793d1 fg=#1a1a2e bold'

# ===== Plugins =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto-save sessions
set -g @plugin 'tmux-plugins/tmux-yank'         # Better copy to system clipboard
set -g @plugin 'tmux-plugins/tmux-open'         # Open URLs/files from copy mode

# Continuum settings
set -g @continuum-restore 'on'        # Auto-restore on tmux start
set -g @continuum-save-interval '15'  # Save every 15 minutes

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
